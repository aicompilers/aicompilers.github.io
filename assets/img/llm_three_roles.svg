<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2833"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C9C"/></marker>
    <style>
      .t{font-size:20px;font-weight:700;fill:#1E2833}
      .s{font-size:13px;fill:#6B7785}
      .b{font-size:15px;font-weight:600;fill:#1E2833}
      .m{font-size:13px;fill:#1E2833}
      .bad{font-size:13px;fill:#B04A36}
      .good{font-size:13px;fill:#3B7D52}
      .ln{stroke:#1E2833;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="1000" height="600" fill="#FFFFFF"/>

  <!-- lanes -->
  <rect x="20" y="15" width="300" height="570" rx="12" fill="#F4F6F8"/>
  <rect x="350" y="15" width="300" height="570" rx="12" fill="#F4F6F8"/>
  <rect x="680" y="15" width="300" height="570" rx="12" fill="#F4F6F8"/>

  <!-- LANE 1: compiler -->
  <text x="170" y="50" text-anchor="middle" class="t">LLM as compiler</text>
  <text x="170" y="72" text-anchor="middle" class="s">Translation happens in the weights</text>
  <rect x="110" y="100" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#1E2833" stroke-width="1.4"/>
  <text x="170" y="127" text-anchor="middle" class="b">Model</text>
  <line x1="170" y1="144" x2="170" y2="172" class="ln" marker-end="url(#a)"/>
  <rect x="45" y="175" width="250" height="170" rx="10" fill="#EEE8F7" stroke="#6A4C9C" stroke-width="1.8"/>
  <text x="170" y="228" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#6A4C9C">LLM</text>
  <text x="170" y="262" text-anchor="middle" class="m">Fusion, tiling, memory planning,</text>
  <text x="170" y="282" text-anchor="middle" class="m">scheduling, code generation</text>
  <text x="170" y="312" text-anchor="middle" class="s">all implicit, token by token</text>
  <line x1="170" y1="345" x2="170" y2="372" class="ln" marker-end="url(#a)"/>
  <rect x="110" y="375" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#1E2833" stroke-width="1.4"/>
  <text x="170" y="402" text-anchor="middle" class="b">Binary</text>
  <text x="50" y="462" class="bad">✕  Billions of FLOPs per decision</text>
  <text x="50" y="486" class="bad">✕  Not reproducible</text>
  <text x="50" y="510" class="bad">✕  Hard to verify or debug</text>
  <rect x="115" y="540" width="110" height="30" rx="15" fill="#F7E6E2"/>
  <text x="170" y="560" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#B04A36">Unlikely</text>

  <!-- LANE 2: orchestrator -->
  <text x="500" y="50" text-anchor="middle" class="t">LLM as orchestrator</text>
  <text x="500" y="72" text-anchor="middle" class="s">Tool mode: the LLM drives the compiler</text>
  <rect x="380" y="100" width="100" height="44" rx="8" fill="#FFFFFF" stroke="#1E2833" stroke-width="1.4"/>
  <text x="430" y="127" text-anchor="middle" class="b">Model</text>
  <rect x="510" y="100" width="110" height="44" rx="8" fill="#EEE8F7" stroke="#6A4C9C" stroke-width="1.8"/>
  <text x="565" y="128" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#6A4C9C">LLM</text>
  <line x1="430" y1="144" x2="430" y2="172" class="ln" marker-end="url(#a)"/>
  <path d="M565,144 L565,172" stroke="#6A4C9C" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ap)"/>
  <path d="M598,172 L598,144" stroke="#6A4C9C" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ap)"/>
  <rect x="380" y="175" width="240" height="170" rx="10" fill="#E4EFF5" stroke="#2B6A8C" stroke-width="1.8"/>
  <text x="392" y="197" style="font-size:13px;font-weight:600;fill:#2B6A8C">Compiler</text>
  <rect x="392" y="212" width="104" height="48" rx="7" fill="#FFFFFF" stroke="#2B6A8C" stroke-width="1.2"/>
  <text x="444" y="241" text-anchor="middle" class="m">Fusion</text>
  <rect x="504" y="212" width="104" height="48" rx="7" fill="#FFFFFF" stroke="#2B6A8C" stroke-width="1.2"/>
  <text x="556" y="241" text-anchor="middle" class="m">Tiling search</text>
  <rect x="392" y="272" width="104" height="48" rx="7" fill="#FFFFFF" stroke="#2B6A8C" stroke-width="1.2"/>
  <text x="444" y="292" text-anchor="middle" class="m">Memory</text><text x="444" y="308" text-anchor="middle" class="m">planner</text>
  <rect x="504" y="272" width="104" height="48" rx="7" fill="#FFFFFF" stroke="#2B6A8C" stroke-width="1.2"/>
  <text x="556" y="301" text-anchor="middle" class="m">Profiler</text>
  <line x1="500" y1="345" x2="500" y2="372" class="ln" marker-end="url(#a)"/>
  <rect x="440" y="375" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#1E2833" stroke-width="1.4"/>
  <text x="500" y="402" text-anchor="middle" class="b">Binary</text>
  <text x="380" y="462" class="good">✓  Heavy lifting stays in the tools</text>
  <text x="380" y="486" class="good">✓  Passes stay deterministic, testable</text>
  <text x="380" y="510" class="good">✓  LLM decides what to run and why</text>
  <rect x="440" y="540" width="120" height="30" rx="15" fill="#E4EFF5"/>
  <text x="500" y="560" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#2B6A8C">Realistic</text>

  <!-- LANE 3: author -->
  <text x="830" y="50" text-anchor="middle" class="t">LLM as author</text>
  <text x="830" y="72" text-anchor="middle" class="s">Writes the code the compiler uses</text>
  <rect x="710" y="100" width="100" height="44" rx="8" fill="#FFFFFF" stroke="#1E2833" stroke-width="1.4"/>
  <text x="760" y="127" text-anchor="middle" class="b">Model</text>
  <rect x="840" y="100" width="110" height="44" rx="8" fill="#EEE8F7" stroke="#6A4C9C" stroke-width="1.8"/>
  <text x="895" y="120" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#6A4C9C">LLM</text>
  <text x="895" y="137" text-anchor="middle" class="s">offline</text>
  <line x1="895" y1="144" x2="895" y2="162" stroke="#6A4C9C" stroke-width="1.6" marker-end="url(#ap)"/>
  <rect x="830" y="165" width="130" height="50" rx="8" fill="#E5F2E8" stroke="#3B7D52" stroke-width="1.8"/>
  <text x="895" y="186" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#3B7D52">Verify</text>
  <text x="895" y="204" text-anchor="middle" style="font-size:11.5px;fill:#3B7D52">correctness, speed</text>
  <line x1="895" y1="215" x2="895" y2="232" stroke="#3B7D52" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="760" y1="144" x2="760" y2="232" class="ln" marker-end="url(#a)"/>
  <rect x="710" y="235" width="240" height="110" rx="10" fill="#E4EFF5" stroke="#2B6A8C" stroke-width="1.8"/>
  <text x="722" y="257" style="font-size:13px;font-weight:600;fill:#2B6A8C">Compiler</text>
  <rect x="722" y="270" width="216" height="60" rx="7" fill="#FFFFFF" stroke="#6A4C9C" stroke-width="1.2"/>
  <text x="830" y="296" text-anchor="middle" class="m">Kernels, lowerings,</text>
  <text x="830" y="315" text-anchor="middle" class="m">heuristics (LLM-written)</text>
  <line x1="830" y1="345" x2="830" y2="372" class="ln" marker-end="url(#a)"/>
  <rect x="770" y="375" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#1E2833" stroke-width="1.4"/>
  <text x="830" y="402" text-anchor="middle" class="b">Binary</text>
  <text x="710" y="462" class="good">✓  New author for low-level code</text>
  <text x="710" y="486" class="good">✓  Nothing ships unverified</text>
  <text x="710" y="510" class="good">✓  Compiler becomes the environment</text>
  <rect x="760" y="540" width="140" height="30" rx="15" fill="#E5F2E8"/>
  <text x="830" y="560" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#3B7D52">Biggest impact</text>
</svg>
