<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2833"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C9C"/></marker>
    <style>
      .t{font-size:20px;font-weight:700;fill:#1E2833}
      .s{font-size:13px;fill:#6B7785}
      .row{font-size:17px;font-weight:700;fill:#1E2833}
      .b{font-size:15px;font-weight:600;fill:#1E2833}
      .m{font-size:13px;fill:#1E2833}
      .ln{stroke:#1E2833;stroke-width:1.6;fill:none}
      .io{fill:#FFFFFF;stroke:#1E2833;stroke-width:1.4}
      .llm{fill:#EEE8F7;stroke:#6A4C9C;stroke-width:1.8}
      .tool{fill:#E4EFF5;stroke:#2B6A8C;stroke-width:1.8}
    </style>
  </defs>
  <rect width="1040" height="440" fill="#FFFFFF"/>

  <!-- column headers -->
  <text x="355" y="40" text-anchor="middle" class="t">In the weights</text>
  <text x="355" y="62" text-anchor="middle" class="s">The LLM does the work itself</text>
  <text x="815" y="40" text-anchor="middle" class="t">Tool mode</text>
  <text x="815" y="62" text-anchor="middle" class="s">The LLM uses the tool</text>
  <line x1="585" y1="85" x2="585" y2="420" stroke="#D5DBE1" stroke-width="1.4"/>
  <line x1="20" y1="250" x2="1020" y2="250" stroke="#E6EAEE" stroke-width="1.2"/>

  <!-- row labels -->
  <text x="20" y="155" class="row">Video</text>
  <text x="20" y="175" class="s">today</text>
  <text x="20" y="325" class="row">AI model</text>
  <text x="20" y="345" class="s">the same logic</text>

  <!-- ROW 1 LEFT -->
  <g opacity="0.5">
    <rect x="140" y="122" width="90" height="56" rx="8" class="io"/>
    <text x="185" y="155" text-anchor="middle" class="b">Video</text>
    <line x1="230" y1="150" x2="257" y2="150" class="ln" marker-end="url(#a)"/>
    <rect x="260" y="122" width="190" height="56" rx="8" class="llm"/>
    <text x="355" y="146" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#6A4C9C">LLM</text>
    <text x="355" y="166" text-anchor="middle" class="m">emits bitstream per token</text>
    <line x1="450" y1="150" x2="477" y2="150" class="ln" marker-end="url(#a)"/>
    <rect x="480" y="122" width="90" height="56" rx="8" class="io"/>
    <text x="525" y="155" text-anchor="middle" class="b">H.265</text>
  </g>
  <line x1="250" y1="112" x2="460" y2="188" stroke="#B04A36" stroke-width="2.2"/>
  <text x="355" y="220" text-anchor="middle" style="font-size:13px;fill:#B04A36">✕  Nobody does this</text>

  <!-- ROW 2 LEFT -->
  <g opacity="0.5">
    <rect x="140" y="292" width="90" height="56" rx="8" class="io"/>
    <text x="185" y="325" text-anchor="middle" class="b">Model</text>
    <line x1="230" y1="320" x2="257" y2="320" class="ln" marker-end="url(#a)"/>
    <rect x="260" y="292" width="190" height="56" rx="8" class="llm"/>
    <text x="355" y="316" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#6A4C9C">LLM</text>
    <text x="355" y="336" text-anchor="middle" class="m">emits binary per token</text>
    <line x1="450" y1="320" x2="477" y2="320" class="ln" marker-end="url(#a)"/>
    <rect x="480" y="292" width="90" height="56" rx="8" class="io"/>
    <text x="525" y="325" text-anchor="middle" class="b">Binary</text>
  </g>
  <line x1="250" y1="282" x2="460" y2="358" stroke="#B04A36" stroke-width="2.2"/>
  <text x="355" y="390" text-anchor="middle" style="font-size:13px;fill:#B04A36">✕  Same mistake, different domain</text>

  <!-- ROW 1 RIGHT -->
  <rect x="605" y="122" width="80" height="56" rx="8" class="llm"/>
  <text x="645" y="155" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#6A4C9C">LLM</text>
  <line x1="685" y1="150" x2="717" y2="150" stroke="#6A4C9C" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ap)"/>
  <rect x="720" y="122" width="180" height="56" rx="8" class="tool"/>
  <text x="810" y="146" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#2B6A8C">ffmpeg</text>
  <text x="810" y="166" text-anchor="middle" class="m">does the encoding</text>
  <line x1="900" y1="150" x2="927" y2="150" class="ln" marker-end="url(#a)"/>
  <rect x="930" y="122" width="90" height="56" rx="8" class="io"/>
  <text x="975" y="155" text-anchor="middle" class="b">H.265</text>
  <path d="M975,178 C975,205 645,205 645,181" stroke="#6A4C9C" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#ap)"/>
  <text x="815" y="222" text-anchor="middle" style="font-size:13px;fill:#3B7D52">✓  LLM writes the command and checks the result</text>

  <!-- ROW 2 RIGHT -->
  <rect x="605" y="292" width="80" height="56" rx="8" class="llm"/>
  <text x="645" y="325" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#6A4C9C">LLM</text>
  <line x1="685" y1="320" x2="717" y2="320" stroke="#6A4C9C" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ap)"/>
  <rect x="720" y="292" width="180" height="56" rx="8" class="tool"/>
  <text x="810" y="316" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#2B6A8C">Compiler passes</text>
  <text x="810" y="336" text-anchor="middle" class="m">do the compiling</text>
  <line x1="900" y1="320" x2="927" y2="320" class="ln" marker-end="url(#a)"/>
  <rect x="930" y="292" width="90" height="56" rx="8" class="io"/>
  <text x="975" y="325" text-anchor="middle" class="b">Binary</text>
  <path d="M975,348 C975,375 645,375 645,351" stroke="#6A4C9C" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#ap)"/>
  <text x="815" y="392" text-anchor="middle" style="font-size:13px;fill:#3B7D52">✓  LLM picks passes, sets parameters, reads the profile</text>
</svg>
